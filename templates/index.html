<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Commerce Assistant</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
<header>
    <div class="container">
        <h1>AI Commerce Assistant</h1>
        <p>Personalized product recommendations powered by your requirements</p>
    </div>
</header>

<main class="container">
    <section class="card">
        <h2>Find Your Product</h2>
        <div class="form-grid">
            <input id="query" type="text" placeholder="Example: I need something for coding">
            <input id="budget" type="number" min="0" placeholder="Budget (₹)">
            <select id="category">
                <option value="all">All Categories</option>
                <option value="electronics">Electronics</option>
                <option value="accessories">Accessories</option>
                <option value="fashion">Fashion</option>
                <option value="home">Home</option>
            </select>
            <button onclick="getRecommendations()">Get Recommendations</button>
        </div>
    </section>

    <section class="card">
        <h2>Recommendations</h2>
        <div id="results" class="products">
            {% for p in products %}
            <div class="product">
                <div class="icon">🛍️</div>
                <div>
                    <h3>{{ p.name }}</h3>
                    <p class="price">₹{{ "%.0f"|format(p.price) }}</p>
                    <p>{{ p.description }}</p>
                </div>
            </div>
            {% endfor %}
        </div>
    </section>

    <section class="card">
        <h2>Ask the Sales Assistant</h2>
        <div id="chat" class="chat"></div>
        <div class="chat-row">
            <input id="message" type="text" placeholder="Example: I need a product for travel">
            <button onclick="sendMessage()">Ask</button>
        </div>
    </section>
</main>

<script src="{{ url_for('static', filename='script.js') }}"></script>
</body>
</html>
